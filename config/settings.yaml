ingestion:
  camera_topic: "/lucid_vision/lucid_cam_front_center/image_rect/compressed"                # ROS2 topic to subscribe to for extracting image frames
  sampling_fps: 1.0                                                                         # Subsampling rate: 1.0 means 1 frame per second.
  max_image_size: [512, 512]                                                                # Maximum size (width, height) for resizing images before processing.
  batch_size: 8                                                                             # Number of frames to process in a batch for feature extraction.

storage:
  artifact_dir: ".bag_chat"                                                                 # The name of the hidden artifact folder created to store app data.
  storage_path: null                                                                        # Optional path to store the artifact directory. If null, it defaults to the indexed bag directory.

models:
  embedding_model: "google/siglip2-base-patch16-naflex"                                     # The model used for extracting visual text-aligned features from images. You can choose from various models available on Hugging Face, such as "google/siglip2-base-patch16-naflex".
  orchestration_llm: "gemma-2-9b"
  video_vlm: "qwen3-vl:2b" # "qwen3-vl:4b"                                                  # The model used for video understanding and question answering. You can choose among Ollama's video-capable models, such as "qwen3-vl:2b".
  model_storage: "models"                                                                   # Directory name where downloaded models checkpoints will be stored.

search:
  temporal_dedup_window_sec: 20.0                                                             # Suppress lower-scoring hits from the same bag/topic sequence within +/- this temporal window around a better-scoring frame.

api:
  scan_timeout_sec: 30.0                                                                      # Maximum seconds allowed for a recursive bag directory scan before returning 504.

extraction:
  service_url: http://localhost:8765                                                                          # URL of the dataset-generation microservice. Set to null to disable the feature entirely.
  request_timeout_sec: 10.0                                                                   # Timeout (seconds) for requests to the extraction microservice.
  default_output_subdir: "nuscenes_extractions"                                               # Subdirectory (under each bag's artifact dir) where NuScenes datasets are written.
  # Fields the user can edit in the UI. All other fields are either inherited from the
  # microservice defaults or overridden by fixed_overrides below.
  editable_fields:
    - calibration_path
    - frames_path
    - target_lidar_frame
    - sync_threshold
    - n_workers
    - save_on_disk
    - topics
  # Strip this prefix from bag paths before forwarding to the microservice.
  # Useful when the service runs in Docker with a different mount point (e.g. /adehome → /).
  path_strip_prefix: "/adehome"
  # Values injected server-side on every extraction request. Users cannot override these.
  fixed_overrides:
    bag_type: mcap
    append_dataset: false
    debug: false
