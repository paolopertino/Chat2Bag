ingestion:
  camera_topics:                                                                            # List of ROS2 camera topics to extract frames from (per-camera Frames; no multi-view fusion).
    - "/lucid_vision/lucid_cam_front_center/image_rect/compressed"
    - "/lucid_vision/lucid_cam_front_left/image_rect/compressed"
    - "/lucid_vision/lucid_cam_front_right/image_rect/compressed"
  sampling_fps: 1.0                                                                          # Subsampling rate per camera: 1.0 means 1 frame per second per topic.
  long_side: 840                                                                             # Aspect-preserving long-edge budget for stored thumbnails (configurable; tune during testing). 840 = 60*14.
  batch_size: 8                                                                              # Hint for embedder batching (the embedder owns real batching).
  gps_topic: "/oxts/nav_sat_fix"   # GPS topic read during extraction for Map search (null => no GPS read)
  gps_max_gap_sec: 1.0             # Nearest-Fix join tolerance (seconds); frames with no Fix within this gap get no location

storage:
  artifact_dir: ".bag_chat"                                                                 # The name of the hidden artifact folder created to store app data.
  storage_path: null                                                                        # Optional path to store the artifact directory. If null, it defaults to the indexed bag directory.

embedding:
  backend: "tipsv2"                                                                         # Registry key: siglip2 | tipsv2
  model: "google/tipsv2-l14"                                                                # HF id or local checkpoint path for the active backend.
  encode_long_side: 896                                                                     # Shared CLS + dense encode geometry (long edge, floored to /14). Tunable; changing it re-indexes both CLS and Region.

models:
  model_storage: "models"                                                                   # Directory name where downloaded models checkpoints will be stored.

search:
  temporal_dedup_window_sec: 20.0                                                             # Suppress lower-scoring hits from the same bag/topic sequence within +/- this temporal window around a better-scoring frame.
  map_browse_cap: 500             # Max Map-browse results returned after temporal dedup
  max_concurrent_searches: 30     # Max embedding/GPU-bound search requests running their blocking work at once (the rest queue). Raise for more parallelism, set to 1 to fully serialize.

region_search:
  enabled: true                 # gated by embedder 'dense' capability; off => no dense pass, no RegionSearcher
  engine: faiss                 # faiss | (future) turbovec
  pq: { m: 64, nbits: 8 }
  ivf: { nlist: null, nprobe: 16 }   # nlist null => auto = n_patches // 4096
  min_patches_for_pq: 10000     # below => exact IndexFlatIP fallback (no training)
  train_sample_cap: 262144      # max Patches used to train IVF-PQ
  patch_fetch_limit: 4096       # patches pulled per bag before group->max
  aggregation: { top_k_patches: 1 }  # 1 == MaxSim; >1 == top-k mean
  refine: { enabled: false, top_n: 100 }
  text_templates:               # ~10-template dashcam ensemble (full-80 / single are A/B alternatives)
    - "a photo of a {}."
    - "a photo of the {}."
    - "a cropped photo of a {}."
    - "a close-up photo of a {}."
    - "a bright photo of a {}."
    - "a dark photo of a {}."
    - "a blurry photo of a {}."
    - "a low resolution photo of a {}."
    - "a jpeg corrupted photo of a {}."
    - "a photo of a hard to see {}."

api:
  scan_timeout_sec: 30.0                                                                      # Maximum seconds allowed for a recursive bag directory scan before returning 504.

extraction:
  service_url: http://localhost:8765                                                                          # URL of the dataset-generation microservice. Set to null to disable the feature entirely.
  request_timeout_sec: 10.0                                                                   # Timeout (seconds) for requests to the extraction microservice.
  default_output_subdir: "nuscenes_extractions"                                               # Subdirectory (under each bag's artifact dir) where NuScenes datasets are written.
  # Fields the user can edit in the UI. All other fields are either inherited from the
  # microservice defaults or overridden by fixed_overrides below.
  editable_fields:
    - calibration_path
    - frames_path
    - target_lidar_frame
    - sync_threshold
    - n_workers
    - save_on_disk
    - topics
  # Strip this prefix from bag paths before forwarding to the microservice.
  # Useful when the service runs in Docker with a different mount point (e.g. /adehome → /).
  path_strip_prefix: "/adehome"
  # Values injected server-side on every extraction request. Users cannot override these.
  fixed_overrides:
    bag_type: mcap
    append_dataset: false
    debug: false
